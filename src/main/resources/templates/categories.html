<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Kategorie: ' + (${category != null} ? ${category} : 'Unbekannt')">Kategorie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<!-- navbar -->
<div th:replace="~{fragments/navbar :: navbar(${category})}"></div>


<main class="container my-4">
    <div th:if="${errorMessage != null}">
        <div class="alert alert-danger" th:text="${errorMessage}">Kategorie nicht gefunden.</div>
        <a href="/" class="btn btn-secondary">Zur Startseite</a>
    </div>

    <div>
        <div class="d-flex justify-content-between align-items-baseline mb-3">
            <h2 th:text="${category}">Kategorie</h2>
            <small class="text-muted" th:text="'Ergebnisse: ' + ${totalElements}">Ergebnisse: 0</small>
        </div>

        <!-- ads -->
        <div th:replace="~{fragments/ad-list-horizontal-paged :: ad-list-horizontal-paged(${'categories/' + category}, 'Für diese Kategorie wurden noch keine Anzeigen veröffentlicht.')}"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
