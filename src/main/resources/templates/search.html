<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suchergebnisse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<!-- navbar -->
<div th:replace="~{fragments/navbar :: navbar(${category})}"></div>

<main class="container my-4">
    <div th:if="${errorMessage != null}">
        <div class="alert alert-danger" th:text="${errorMessage}">Kategorie nicht gefunden.</div>
        <a href="/" class="btn btn-secondary">Zur Startseite</a>
    </div>

    <div>
        <div class="d-flex justify-content-between align-items-baseline mb-3">
            <div class="d-flex align-items-baseline gap-2">
                <h2>Suchergebnisse</h2>
                <small class="text-muted" th:text="'Ergebnisse: ' + ${totalElements}">Ergebnisse: 0</small>
            </div>
            <form class="d-flex align-items-center" method="get" action="/search">
                <input type="hidden" name="title" th:if="${title != null}" th:value="${title}"/>
                <input type="hidden" name="category" th:if="${category != null}" th:value="${category}"/>
                <input type="hidden" name="address" th:if="${address != null}" th:value="${address}"/>
                <input type="hidden" name="radius" th:if="${radius != null}" th:value="${radius}"/>

                <select name="sort" class="form-select me-2" onchange="this.form.submit()">
                    <option value="relevance"
                            th:selected="${sort == 'relevance'}"
                            th:text="${address != null} ? 'Relevanz (Entfernung)' : 'Relevanz (Suchbegriff)'">
                        Relevanz
                    </option>
                    <option value="title_asc" th:selected="${sort == 'title_asc'}">Bezeichnung ↑</option>
                    <option value="title_desc" th:selected="${sort == 'title_desc'}">Bezeichnung ↓</option>
                    <option value="price_asc" th:selected="${sort == 'price_asc'}">Preis ↑</option>
                    <option value="price_desc" th:selected="${sort == 'price_desc'}">Preis ↓</option>
                </select>
            </form>
        </div>

        <!-- ads -->
        <div th:replace="~{fragments/ad-list-horizontal-paged :: ad-list-horizontal-paged(
                'search?title=' + ${title}
                + (${category == null} ? '' : '&category=' + ${category})
                + (${address == null} ? '' : '&address=' + ${address})
                + (${radius == null} ? '' : '&radius=' + ${radius}), 'Keine Suchergebnisse.')}"></div>

        <!-- external results -->
        <div class="mt-5" th:if="${externalResults != null and !externalResults.isEmpty()}">
            <h3 class="mb-3">Ergebnisse anderer Teams</h3>
            <div class="row">
                <div class="col-md-6 mb-4" th:each="portalResult : ${externalResults}">
                    <div class="card h-100">
                        <div class="card-header bg-light fw-bold" th:text="${portalResult.portal}">Portal Name</div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="result : ${portalResult.results}">
                                <a class="text-decoration-none text-truncate" style="max-width: 70%;" target="_blank"
                                   th:href="${result.url}" th:text="${result.article}">Artikel</a>
                                <span class="badge bg-primary rounded-pill"
                                      th:text="${result.price} + ' €'">Price</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
