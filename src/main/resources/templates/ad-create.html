<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Neue Anzeige erstellen</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<body>
<!-- navbar -->
<div th:replace="~{fragments/navbar :: navbar(${null})}"></div>

<main class="container my-4">
    <h2>Neue Anzeige erstellen</h2>
    <form enctype="multipart/form-data" method="post" th:action="@{/ads/new}" th:object="${ad}">
        <div class="row">
            <div class="mb-3">
                <label class="form-label" for="title">Titel</label>
                <input class="form-control" id="title" required th:field="*{title}" type="text">
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Beschreibung</label>
                <textarea class="form-control" id="description" required rows="5" th:field="*{description}"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col-5">
                <div class="mb-3">
                    <label class="form-label" for="price">Preis (€)</label>
                    <input class="form-control" id="price" required step="0.01" th:field="*{price}" type="number">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="category">Kategorie</label>
                    <input class="form-control" id="category" required th:field="*{category}" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="file">Bild (optional)</label>
                    <input class="form-control" id="file" name="file" type="file">
                </div>
            </div>
            <div class="col-7">
                <div th:replace="~{fragments/ad-address-form :: ad-address-form(${ad})}"></div>
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Anzeige erstellen</button>
        <a class="btn btn-secondary" href="/">Abbrechen</a>
    </form>
</main>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
