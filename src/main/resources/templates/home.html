<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kleinanzeigen - Startseite</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Eigene CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<!-- NAV / Suchleiste oben -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">Kleinanzeigen</a>
        <div class="collapse navbar-collapse">
            <form class="d-flex ms-auto" action="/search" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="Suche nach Anzeigen..." aria-label="Search">
                <button class="btn btn-outline-primary" type="submit">Suchen</button>
            </form>
        </div>
    </div>
</nav>

<main class="container my-4">
    <!-- Zufällige Anzeigen -->
    <section>
        <h2 class="mb-3">Zufällige Anzeigen</h2>
        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(randomAds)}">
                <div class="alert alert-info">Momentan sind keine Anzeigen vorhanden.</div>
            </div>

            <div class="col-sm-6 col-md-4 col-lg-3" th:each="ad : ${randomAds}">
                <div class="card h-100">
                    <img th:src="${ad.imageUrl != null ? ad.imageUrl : '/images/placeholder.png'}"
                         class="card-img-top" alt="Vorschaubild" style="height:180px; object-fit:cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${ad.title}">Titel</h5>
                        <p class="card-text text-truncate" th:text="${ad.description}">Kurzbeschreibung...</p>
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <span class="fw-bold" th:text="${#numbers.formatDecimal(ad.price, 0, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                            <a th:href="@{'/ads/' + ${ad.id}}" class="btn btn-sm btn-outline-primary">Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <hr class="my-4"/>

    <!-- Kategorien -->
    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Kategorien</h2>
            <small class="text-muted">Anzahl: <span th:text="${categoryCount}">0</span></small>
        </div>

        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(categories)}">
                <div class="alert alert-info">Keine Kategorien vorhanden.</div>
            </div>

            <div class="col-6 col-md-4 col-lg-3" th:each="cat : ${categories}">
                <a th:href="@{'/categories/' + ${cat}}" class="text-decoration-none text-dark">
                    <div class="card category-card h-100">
                        <div class="card-body">
                            <h5 class="card-title mb-0" th:text="${cat}">Kategorie</h5>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
