<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kleinanzeigen - Startseite</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- own CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<!-- navbar -->
<div th:replace="~{fragments/navbar :: navbar(${null})}"></div>

<main class="container my-4">

    <!-- User/Login Section -->
    <section class="mb-4">
        <div class="alert alert-success" th:if="${userId != null}">
            Angemeldet als: <strong th:text="${userId}"></strong>
            <a class="btn btn-sm btn-primary ms-2" th:href="@{/ads/new}">Anzeige erstellen</a>
            <a class="btn btn-sm btn-outline-danger ms-2" th:href="@{/logout}">Logout</a>
        </div>
        <div th:unless="${userId != null}">
            <form class="d-flex" method="post" th:action="@{/login}">
                <input class="form-control me-2" name="username" placeholder="Benutzernamen eingeben..." required
                       type="text"/>
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
        </div>
    </section>
    <!-- Random ads -->
    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-3">Zufällige Anzeigen</h2>
            <div>
                <small class="text-muted me-3">Anzeigen gesamt: <span th:text="${adCount}">0</span></small>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(randomAds)}">
                <div class="alert alert-info">Momentan sind keine Anzeigen vorhanden.</div>
            </div>

            <div class="col-sm-6 col-md-4 col-lg-3" th:each="ad : ${randomAds}">
                <div th:replace="~{fragments/ad-card :: ad-card(${ad})}"></div>
            </div>
        </div>
    </section>

    <hr class="my-4"/>

    <!-- Categories -->
    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Kategorien</h2>
            <div>
                <small class="text-muted">Anzahl Kategorien: <span th:text="${categoryCount}">0</span></small>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(categories)}">
                <div class="alert alert-info">Keine Kategorien vorhanden.</div>
            </div>

            <div class="col-6 col-md-4 col-lg-3" th:each="cat : ${categories}">
                <a th:href="@{'/categories/' + ${cat}}" class="text-decoration-none text-dark">
                    <div class="card category-card h-100">
                        <div class="card-body">
                            <h5 class="card-title mb-0" th:text="${cat}">Kategorie</h5>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
