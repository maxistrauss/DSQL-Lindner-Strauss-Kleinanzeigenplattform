<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<nav th:fragment="navbar(category)" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container d-flex align-items-center">
        <a class="navbar-brand" href="/">OTH-Kleinanzeigen-Portal</a>
        <div class="middle-div flex-grow-1 mx-2" style="max-width: 60%;">
            <form action="/search" class="d-flex ms-auto position-relative" method="get"
                  onsubmit="pruneEmptyInputs(this)">
                <div class="me-2 position-relative" style="flex: 3;">
                    <input aria-label="Search"
                           autocomplete="off"
                           class="form-control"
                           id="searchInput"
                           name="title"
                           placeholder="Suche..."
                           th:value="${param.title}"
                           type="search"/>
                    <div class="list-group position-absolute w-100 z-3 d-none" id="autocomplete-results"
                         style="top: 100%;">
                        <!-- Results will be injected here -->
                    </div>
                </div>

                <script>
                    const searchInput = document.getElementById('searchInput');
                    const resultsContainer = document.getElementById('autocomplete-results');

                    searchInput.addEventListener('input', function () {
                        const term = this.value.trim();
                        if (term.length < 2) {
                            resultsContainer.classList.add('d-none');
                            return;
                        }

                        fetch('/autocomplete?term=' + encodeURIComponent(term))
                            .then(response => response.json())
                            .then(data => {
                                if (data.length === 0) {
                                    resultsContainer.classList.add('d-none');
                                    return;
                                }

                                resultsContainer.innerHTML = '';
                                data.forEach(item => {
                                    const button = document.createElement('button');
                                    button.type = 'button';
                                    button.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';

                                    let content = `<span>${item.text}</span>`;
                                    if (item.type === 'trend') {
                                        content = `<span><i class="bi bi-fire text-danger me-2"></i>${item.text}</span>
                                                   <span class="badge bg-warning text-dark rounded-pill" style="font-size: 0.7rem;">Trend</span>`;
                                    } else {
                                        content = `<span><i class="bi bi-search text-muted me-2"></i>${item.text}</span>`;
                                    }

                                    button.innerHTML = content;
                                    button.addEventListener('click', () => {
                                        searchInput.value = item.text;
                                        resultsContainer.classList.add('d-none');
                                        searchInput.closest('form').submit();
                                    });
                                    resultsContainer.appendChild(button);
                                });
                                resultsContainer.classList.remove('d-none');
                            });
                    });

                    // Close dropdown when clicking outside
                    document.addEventListener('click', function (e) {
                        if (!searchInput.contains(e.target) && !resultsContainer.contains(e.target)) {
                            resultsContainer.classList.add('d-none');
                        }
                    });
                </script>

                <!-- address -->
                <input type="text"
                       name="address"
                       class="form-control me-2"
                       style="flex: 1;"
                       placeholder="PLZ oder Ort"
                       th:value="${address}">

                <!-- radius -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            style="min-width: 160px; max-width: 160px"
                            id="radiusToggle"
                            th:text="${radius != null} ? 'Umkreis: ' + ${radius} + ' km' : 'Umkreis wählen'">>
                        Umkreis
                    </button>

                    <!-- slider -->
                    <div class="dropdown-menu p-3" style="min-width: 250px;">
                        <label for="radiusSlider" class="form-label mb-1">Entfernung:</label>

                        <input type="range"
                               id="radiusSlider"
                               min="0"
                               th:max="${radiusOptions.size()-1}"
                               step="1"
                               class="form-range"
                               th:value="${radiusOptions.indexOf(radius) ?: 3}">
                        <!--TODO only send address and radius if necessary -> same with title in general-->
                        <div class="text-center mt-2">
                            <span id="radiusValue" class="fw-semibold" th:text="${radius != null ? radius + ' km' : '25 km'}">25 km</span>
                        </div>
                    </div>
                    <script th:inline="javascript">
                        function getCookie(name) {
                            const value = `; ${document.cookie}`;
                            const parts = value.split(`; ${name}=`);
                            if (parts.length === 2) return parts.pop().split(';').shift();
                        }

                        document.addEventListener("DOMContentLoaded", () => {
                            /*<![CDATA[*/
                            const radiusMap = /*[[${radiusOptions}]]*/null;
                            /*]]>*/
                            const slider = document.getElementById("radiusSlider");
                            const display = document.getElementById("radiusValue");
                            const button = document.getElementById("radiusToggle");


                            if (!slider) return;

                            // Helfer: setze / erstelle hidden input "radius" in *allen* such-forms (action="/search")
                            function setRadiusOnAllSearchForms(radiusKm) {
                                // Wähle alle Formulare, die auf /search submitten (Sort-Form & Search-Form)
                                const forms = document.querySelectorAll('form[action="/search"]');
                                forms.forEach(form => {
                                    let inp = form.querySelector('input[name="radius"]');
                                    if (!inp) {
                                        inp = document.createElement("input");
                                        inp.type = "hidden";
                                        inp.name = "radius";
                                        // optional: markiere den Ersteller
                                        inp.dataset.owner = "radius-sync";
                                        form.appendChild(inp);
                                    }
                                    inp.value = String(radiusKm);
                                });
                            }

                            function removeRadiusFromAllSearchForms() {
                                const forms = document.querySelectorAll('form[action="/search"]');
                                forms.forEach(form => {
                                    const inp = form.querySelector('input[name="radius"]');
                                    if (inp) inp.remove();
                                });
                            }

                            // If address exists, we want to send radius; otherwise remove radius inputs
                            const addressField = document.querySelector("input[name='address']");

                            const updateDisplay = () => {
                                const idx = Number(slider.value);
                                const radiusKm = radiusMap[idx];
                                display.textContent = radiusKm + " km";

                                // Button text — besser: inner span (avoid layout jump)
                                const span = button.querySelector("span");
                                if (span) span.textContent = "Umkreis: " + radiusKm + " km";
                                else button.textContent = "Umkreis: " + radiusKm + " km";

                                // only add/send radius when address is filled
                                const addr = addressField ? addressField.value.trim() : "";
                                if (addr !== "") {
                                    setRadiusOnAllSearchForms(radiusKm);
                                } else {
                                    removeRadiusFromAllSearchForms();
                                }

                                console.debug("slider update:", { idx, radiusKm, address: addr });
                            };

                            addressField.addEventListener("input", updateDisplay);
                            slider.addEventListener("input", updateDisplay);
                            updateDisplay();
                        });
                        //# sourceURL=debugRadiusJS.js
                    </script>
                </div>
                <!-- only add if category != null -->
                <input type="hidden" name="category"
                       th:if="${category != null}"
                       th:value="${category}" />
                <button class="btn btn-outline-primary" type="submit">Suchen</button>
            </form>
            <script>
                function pruneEmptyInputs(form) {
                    const controls = form.querySelectorAll('input, select, textarea');
                    controls.forEach(c => {
                        // ignore controls without name (they aren't submitted anyway)
                        if(!c.name) return;

                        // for checkboxes/radios: submit only if checked
                        if((c.type === 'checkbox' || c.type === 'radio') && !c.checked) {
                            // remove name so it won't be submitted
                            c.removeAttribute('name');
                            return;
                        }

                        // for other controls: if empty string -> remove name to avoid name=
                        const value = (c.value || '').toString().trim();
                        if(value === '') {
                            c.removeAttribute('name'); // alternative: c.disabled = true;
                        }
                    });

                    // Note: we don't return false -> allow normal submit to continue
                }
                //# sourceURL=debugRemoveAttributesJS.js
            </script>
        </div>
        <!-- User/Login -->
        <div>
            <div class="d-flex align-items-center" th:if="${userId != null}">
                <span class="border border-success rounded px-2 py-1 bg-success-subtle ms-2">Angemeldet als: <strong th:text="${userId}"></strong></span>
                <a class="btn btn-sm btn-primary ms-2" th:href="@{/ads/new}">Anzeige erstellen</a>
                <a class="btn btn-sm btn-outline-danger ms-2" th:href="@{/logout}">Logout</a>
            </div>
            <div th:unless="${userId != null}">
                <form class="d-flex" method="post" th:action="@{/login}">
                    <input class="form-control me-2" name="username" placeholder="Benutzernamen eingeben..." required
                           type="text"/>
                    <button class="btn btn-primary" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
</nav>
