<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<div th:fragment="ad-card(ad)" class="card h-100">
    <img alt="Vorschaubild" class="card-img-top" style="height:180px; object-fit:cover;"
         th:if="${ad.imageId != null}" th:src="@{'/images/' + ${ad.imageId}}">
    <img alt="Vorschaubild" class="card-img-top" style="height:180px; object-fit:cover;"
         th:if="${ad.imageId == null}" th:src="@{/images/placeholder.png}">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title" th:text="${ad.title}">Titel</h5>
        <p class="card-text text-truncate" th:text="${ad.description}">Kurzbeschreibung...</p>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <small class="text-muted" th:text="${#temporals.format(ad.publishedAt, 'dd.MM.yyyy HH:mm')}">01.01.2024</small>
            <div>
                <span class="fw-bold me-2" th:text="${#numbers.formatDecimal(ad.price, 0, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                <a th:href="@{'/ads/' + ${ad.id}}" class="btn btn-sm btn-outline-primary">Details</a>
            </div>
        </div>
    </div>
</div>
