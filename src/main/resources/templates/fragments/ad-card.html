<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<div th:fragment="ad-card(ad)" class="card h-100" style="width: 100%;">
    <a th:href="@{'/ads/' + ${ad.id}}" class="card-img-top" style="height:180px; object-fit:cover;">
        <img alt="Vorschaubild" class="card-img-top" style="height:180px; object-fit:cover;"
             th:if="${ad.imageId != null}" th:src="@{'/images/' + ${ad.imageId}}">
        <img alt="Vorschaubild" class="card-img-top" style="height:180px; object-fit:cover;"
             th:if="${ad.imageId == null}" th:src="@{/images/placeholder.png}">
    </a>
    <div class="card-body d-flex flex-column">
        <a th:href="@{'/ads/' + ${ad.id}}" class="text-decoration-none text-dark link-underline-opacity-0 link-underline-opacity-100-hover">
            <div class="d-flex justify-content-between align-items-start">
                <h5 class="card-title text-truncate" th:text="${ad.title}">Titel</h5>
                <div class="d-flex gap-2">
                    <div class="badge bg-info text-dark d-flex align-items-center gap-1" th:if="${ad.numberOfComments > 0}">
                        <i class="bi bi-chat-square-text-fill"></i>
                        <span class="mt-auto" th:text="${ad.numberOfComments}"></span>
                    </div>
                    <div class="badge bg-info text-dark d-flex align-items-center gap-1" th:if="${ad.distanceKm != null}">
                        <i class="bi bi-geo-fill"></i>
                        <span class="mt-auto" th:text="${#numbers.formatDecimal(ad.distanceKm, 1, 'COMMA', 2, 'POINT')} + ' km'"></span>
                    </div>
                </div>
            </div>
        </a>
        <p class="card-text text-truncate" th:text="${ad.description}">Kurzbeschreibung...</p>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <small class="text-muted" th:text="${#temporals.format(ad.publishedAt, 'dd.MM.yyyy HH:mm')}">01.01.2024</small>
            <div>
                <span class="fw-bold me-2" th:text="${#numbers.formatDecimal(ad.price, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
                <a th:href="@{'/ads/' + ${ad.id}}" class="btn btn-sm btn-outline-primary">Details</a>
            </div>
        </div>
    </div>
</div>
